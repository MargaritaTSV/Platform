name: validate

on:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # weekly: compile the whole bank
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/validate.py --selftest
      - run: python scripts/figures.py selftest
      - run: python scripts/validate.py
      - uses: pandoc/actions/setup@v1
        with:
          version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .build-cache/html
          key: html-${{ github.run_id }}
          restore-keys: html-
      - run: python scripts/render.py
      - run: python scripts/search.py
      # Fails on any math KaTeX cannot render.
      - run: python scripts/build.py
      - name: Install TeX
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends texlive-xetex texlive-lang-cyrillic texlive-latex-extra texlive-fonts-recommended fonts-dejavu
      - name: XeLaTeX check
        env:
          BASE: ${{ github.base_ref }}
        run: |
          # A pull request that leaves latex/ and the validator alone compiles only its own problems.
          if [ -n "$BASE" ] && git diff --quiet "origin/$BASE...HEAD" -- latex scripts/validate.py; then
            files=$(git diff --name-only --diff-filter=d "origin/$BASE...HEAD" -- 'content/problems/*.tex')
            if [ -n "$files" ]; then python scripts/validate.py --tex $files; fi
          else
            python scripts/validate.py --tex
          fi
