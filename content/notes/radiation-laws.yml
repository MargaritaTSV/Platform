title: { en: "Radiation laws", ru: "Законы излучения" }
area: radiation
subtopic: radiation-laws
body:
  en: |
    A star radiates roughly as a black body, so three laws describe its light.

    - Wien's law: the wavelength of peak emission is inversely proportional to
      temperature, lambda_max * T = 2.9e-3 m*K. Hotter stars look bluer.
    - Stefan-Boltzmann law: the power radiated per unit area is sigma * T^4.
    - Luminosity: L = 4 * pi * R^2 * sigma * T^4, so a star's brightness grows
      with both its size and the fourth power of its temperature.
  ru: |
    Звезда излучает примерно как абсолютно чёрное тело, и её свет описывают три закона.

    - Закон Вина: длина волны максимума излучения обратно пропорциональна
      температуре, lambda_max * T = 2.9e-3 м*К. Более горячие звёзды голубее.
    - Закон Стефана-Больцмана: мощность с единицы площади равна sigma * T^4.
    - Светимость: L = 4 * pi * R^2 * sigma * T^4, то есть яркость звезды растёт
      и с размером, и как четвёртая степень температуры.
