statement:
  en: |
    A spacecraft is on a circular orbit of radius r around the Earth. Using the
    vis-viva equation, find the extra speed it must gain at one point so that its
    new orbit just reaches a distance 3r at apogee.
  ru: |
    Космический аппарат движется по круговой орбите радиуса r вокруг Земли.
    Пользуясь уравнением vis-viva, найдите добавочную скорость, которую нужно
    сообщить ему в одной точке, чтобы новая орбита достигала расстояния 3r в апогее.
