statement:
  en: |
    The spectrum of a star peaks at a wavelength of 480 nm. Use Wien's law to
    estimate its surface temperature, then compare its luminosity with the Sun's
    if its radius is twice the solar radius.
  ru: |
    Спектр звезды имеет максимум на длине волны 480 нм. По закону Вина оцените
    температуру её поверхности, а затем сравните её светимость со светимостью
    Солнца, если её радиус вдвое больше солнечного.
