# DRAFT topic structure for StellarTask. Replace names and subtopics with the real list.
# Two levels: areas (the stars on the home-page map) contain subtopics.
# Every problem file sets `area` and `subtopic` to keys from this file.
# `star` = position on the map in design/map.json units (viewBox 1088 x 520).
# Russian descriptions are left empty (TODO).

areas:
  - key: celestial-mechanics
    name: { en: "Celestial mechanics", ru: "Небесная механика" }
    description: { en: "How bodies move under gravity: orbits, periods, speeds and masses.", ru: "" }
    star: { x: 110, y: 300, size: 26, filled: true }
    subtopics:
      - key: keplers-laws
        name: { en: "Kepler’s laws", ru: "Законы Кеплера" }
        description: { en: "Periods, semi-major axes, areal velocity", ru: "" }
      - key: orbital-speed-and-energy
        name: { en: "Orbital speed and energy", ru: "Орбитальные скорости и энергия" }
        description: { en: "Vis-viva, circular and escape speeds", ru: "" }
      - key: masses-from-orbits
        name: { en: "Masses from orbits", ru: "Массы по орбитам" }
        description: { en: "The two-body problem, masses of planets and binaries", ru: "" }
      - key: synodic-and-sidereal-periods
        name: { en: "Synodic and sidereal periods", ru: "Синодический и сидерический периоды" }
        description: { en: "Conjunctions, oppositions, configurations", ru: "" }
      - key: transfer-orbits
        name: { en: "Transfer orbits", ru: "Перелётные орбиты" }
        description: { en: "Hohmann transfers, launches, spaceflight", ru: "" }
      - key: tides-and-the-roche-limit
