# Topics (the stars on the home map), their subtopics, and problem sources.
# A problem's `topic`, `subtopic` and `source` must be keys from this file.
# Keys are permanent once problems use them. `star` = map position (viewBox 1088 x 520).
# Topics and subtopics come from notes/topicslist.txt.

topics:
  - key: spherical-astronomy
    name: { en: "Spherical astronomy", ru: "Сферическая астрономия" }
    description: { en: "Positions on the sky: coordinates, time and the celestial sphere.", ru: "Положения на небе: координаты, время и небесная сфера." }
    star: { x: 110, y: 150, size: 26, filled: true }
    subtopics:
      - key: coordinate-systems
        name: { en: "Coordinate transformations", ru: "Преобразование координат" }
        description: { en: "Horizontal, equatorial, ecliptic, galactic", ru: "Горизонтальные, экваториальные, эклиптические, галактические" }
      - key: rising-and-setting
        name: { en: "Rising and setting", ru: "Восход и заход" }
        description: { en: "Rising, setting, culmination, circumpolar objects", ru: "Восход, заход, кульминации, незаходящие светила" }
      - key: twilight-and-day-length
        name: { en: "Twilight and day length", ru: "Сумерки и длина дня" }
        description: { en: "Twilight, polar day and night, length of day", ru: "Сумерки, полярный день и ночь, продолжительность дня" }
      - key: time-and-calendars
        name: { en: "Time and calendars", ru: "Время и календари" }
        description: { en: "Sidereal and solar time, equation of time, Julian date", ru: "Звёздное и солнечное время, уравнение времени, юлианская дата" }
      - key: precession-and-parallax
        name: { en: "Precession and parallax", ru: "Прецессия и параллакс" }
        description: { en: "Precession, nutation, aberration, parallax, refraction", ru: "Прецессия, нутация, аберрация, параллакс, рефракция" }
      - key: planetary-configurations
        name: { en: "Planetary configurations", ru: "Конфигурации планет" }
        description: { en: "Elongations, synodic periods, phases", ru: "Элонгации, синодические периоды, фазы" }
      - key: practical-positioning
        name: { en: "Practical positioning", ru: "Практическая астрометрия" }
        description: { en: "Gnomon, sundials, sextant and other positioning tasks", ru: "Гномон, солнечные часы, секстант и определение положения" }

  - key: celestial-mechanics
    name: { en: "Celestial mechanics", ru: "Небесная механика" }
    description: { en: "How bodies move under gravity: orbits, periods, speeds and masses.", ru: "Как тела движутся под действием тяготения: орбиты, периоды, скорости и массы." }
    star: { x: 545, y: 150, size: 30, filled: true }
    subtopics:
      - key: keplers-laws
        name: { en: "Kepler’s laws", ru: "Законы Кеплера" }
        description: { en: "Kepler’s laws and orbital elements", ru: "Законы Кеплера и элементы орбит" }
      - key: energy-and-velocities
        name: { en: "Energy and velocities", ru: "Энергия и скорости" }
        description: { en: "Vis-viva, escape and circular velocity", ru: "Интеграл энергии, круговая и параболическая скорости" }
      - key: transfer-orbits
        name: { en: "Transfer orbits", ru: "Перелётные орбиты" }
        description: { en: "Hohmann transfers, Δv budgets, gravity assists", ru: "Гомановские перелёты, запас Δv, гравитационные манёвры" }
      - key: binary-orbits
        name: { en: "Two-body problem", ru: "Задача двух тел" }
        description: { en: "Barycentre and binary orbits", ru: "Барицентр и орбиты двойных систем" }
      - key: tides
        name: { en: "Tides", ru: "Приливы" }
        description: { en: "Roche limit, tidal locking, recession of the Moon", ru: "Предел Роша, приливный захват, удаление Луны" }
      - key: lagrange-points
        name: { en: "Lagrange points", ru: "Точки Лагранжа" }
        description: { en: "Hill sphere, restricted three-body problem", ru: "Сфера Хилла, ограниченная задача трёх тел" }
      - key: non-gravitational-effects
        name: { en: "Non-gravitational effects", ru: "Негравитационные эффекты" }
        description: { en: "Poynting–Robertson, Yarkovsky, solar sail, drag", ru: "Эффекты Пойнтинга–Робертсона и Ярковского, солнечный парус, торможение" }

  - key: eclipses
    name: { en: "Eclipses", ru: "Затмения" }
    description: { en: "Alignments of the Sun, Earth and Moon: solar and lunar eclipses.", ru: "Расположение Солнца, Земли и Луны: солнечные и лунные затмения." }
    star: { x: 330, y: 90, size: 18, filled: false }
    subtopics:
      - key: shadow-geometry
        name: { en: "Shadow geometry", ru: "Геометрия тени" }
        description: { en: "Lengths of the umbra and penumbra", ru: "Длины конусов тени и полутени" }
      - key: solar-eclipses
        name: { en: "Solar eclipses", ru: "Солнечные затмения" }
        description: { en: "Path, duration, magnitude, total and annular", ru: "Полоса, длительность, фаза, полные и кольцеобразные" }
      - key: lunar-eclipses
        name: { en: "Lunar eclipses", ru: "Лунные затмения" }
        description: { en: "Contacts, duration, colour and brightness of the Moon", ru: "Контакты, длительность, цвет и яркость Луны" }
      - key: saros-and-lunar-months
        name: { en: "Saros and lunar months", ru: "Сарос и лунные месяцы" }
        description: { en: "Saros; draconic, anomalistic and synodic months", ru: "Сарос; драконический, аномалистический и синодический месяцы" }
      - key: occultations
        name: { en: "Occultations", ru: "Покрытия" }
        description: { en: "Occultations and grazing events", ru: "Покрытия светил и касательные явления" }
      - key: planetary-transits
        name: { en: "Planetary transits", ru: "Прохождения планет" }
        description: { en: "Depth, duration, timing", ru: "Глубина, длительность, моменты" }
      - key: eclipsing-binaries
        name: { en: "Eclipsing binaries", ru: "Затменные двойные" }
        description: { en: "Light curves of eclipsing binary stars", ru: "Кривые блеска затменных двойных звёзд" }

  - key: optics
    name: { en: "Optics", ru: "Оптика" }
    description: { en: "How instruments collect light: telescopes, resolution and detectors.", ru: "Как приборы собирают свет: телескопы, разрешение и приёмники." }
    star: { x: 120, y: 360, size: 20, filled: false }
    subtopics:
      - key: telescopes
        name: { en: "Telescope parameters", ru: "Параметры телескопа" }
        description: { en: "Aperture, focal ratio, magnification, field of view", ru: "Апертура, относительное отверстие, увеличение, поле зрения" }
      - key: diffraction-limit
        name: { en: "Diffraction limit", ru: "Дифракционный предел" }
        description: { en: "Rayleigh criterion, Airy disk, seeing", ru: "Критерий Рэлея, диск Эйри, качество изображения" }
      - key: limiting-magnitude
        name: { en: "Light-gathering power", ru: "Проницающая способность" }
        description: { en: "Light-gathering power and limiting magnitude", ru: "Светособирающая сила и предельная звёздная величина" }
      - key: detectors
        name: { en: "Detectors and noise", ru: "Приёмники и шумы" }
        description: { en: "CCDs, exposure time, signal-to-noise ratio", ru: "ПЗС-матрицы, выдержка, отношение сигнал/шум" }
      - key: spectrographs
        name: { en: "Spectrographs", ru: "Спектрографы" }
        description: { en: "Diffraction gratings, resolving power", ru: "Дифракционные решётки, разрешающая способность" }
      - key: interferometry
        name: { en: "Interferometry", ru: "Интерферометрия" }
        description: { en: "Interferometers and baselines", ru: "Интерферометры и базы" }
      - key: aberrations-and-atmosphere
        name: { en: "Aberrations and atmosphere", ru: "Аберрации и атмосфера" }
        description: { en: "Optical aberrations and atmospheric effects", ru: "Аберрации оптики и влияние атмосферы" }

  - key: astrophysics
    name: { en: "Astrophysics", ru: "Астрофизика" }
    description: { en: "How stars shine and how far away they are: light, spectra and evolution.", ru: "Как светят звёзды и как далеко они находятся: свет, спектры и эволюция." }
    star: { x: 340, y: 410, size: 30, filled: true }
    subtopics:
      - key: magnitudes
        name: { en: "Magnitudes", ru: "Звёздные величины" }
        description: { en: "Colour indices, bolometric corrections, distance modulus", ru: "Показатели цвета, болометрические поправки, модуль расстояния" }
      - key: distance-ladder
        name: { en: "Distance ladder", ru: "Шкала расстояний" }
        description: { en: "Parallax, standard candles, Cepheids, type Ia supernovae", ru: "Параллакс, стандартные свечи, цефеиды, сверхновые Ia" }
      - key: stellar-scaling-relations
        name: { en: "Scaling relations", ru: "Звёздные зависимости" }
        description: { en: "Mass–luminosity relation, main-sequence lifetime", ru: "Зависимость масса–светимость, время жизни на главной последовательности" }
      - key: stellar-structure
        name: { en: "Stellar structure", ru: "Строение звёзд" }
        description: { en: "Hydrostatic equilibrium, virial theorem, Eddington limit", ru: "Гидростатическое равновесие, теорема вириала, предел Эддингтона" }
      - key: nuclear-energy
        name: { en: "Nuclear energy", ru: "Ядерная энергия" }
        description: { en: "Energy sources and timescales", ru: "Источники энергии и характерные времена" }
      - key: compact-objects
        name: { en: "Compact objects", ru: "Компактные объекты" }
        description: { en: "White dwarfs, neutron stars, black holes, Chandrasekhar limit", ru: "Белые карлики, нейтронные звёзды, чёрные дыры, предел Чандрасекара" }
      - key: binaries-and-exoplanets
        name: { en: "Binaries and exoplanets", ru: "Двойные и экзопланеты" }
        description: { en: "Mass function, radial velocity, transit method", ru: "Функция масс, лучевые скорости, метод транзитов" }

  - key: galaxies
    name: { en: "Galaxies", ru: "Галактики" }
    description: { en: "Our galaxy and others: structure, types and distances.", ru: "Наша Галактика и другие: строение, типы и расстояния." }
    star: { x: 760, y: 95, size: 22, filled: false }
    subtopics:
      - key: rotation-curves
        name: { en: "Rotation curves", ru: "Кривые вращения" }
        description: { en: "Rotation curves and dark matter estimates", ru: "Кривые вращения и оценки тёмной материи" }
      - key: the-milky-way
        name: { en: "The Milky Way", ru: "Млечный Путь" }
        description: { en: "Structure, Oort constants, galactic rotation", ru: "Строение, постоянные Оорта, вращение Галактики" }
      - key: scaling-relations
        name: { en: "Brightness and scaling", ru: "Яркость и зависимости" }
        description: { en: "Surface brightness profiles, Tully–Fisher, Faber–Jackson", ru: "Профили поверхностной яркости, Талли–Фишер, Фабер–Джексон" }
      - key: galaxy-clusters
        name: { en: "Clusters of galaxies", ru: "Скопления галактик" }
        description: { en: "Virial mass of clusters", ru: "Вириальная масса скоплений" }
      - key: active-galactic-nuclei
        name: { en: "Active galactic nuclei", ru: "Активные ядра галактик" }
        description: { en: "Quasars, accretion, Eddington luminosity", ru: "Квазары, аккреция, эддингтоновская светимость" }
      - key: gravitational-lensing
        name: { en: "Gravitational lensing", ru: "Гравитационные линзы" }
        description: { en: "Lensing and microlensing", ru: "Линзирование и микролинзирование" }
      - key: supermassive-black-holes
        name: { en: "Supermassive black holes", ru: "Сверхмассивные чёрные дыры" }
        description: { en: "Sgr A*, orbits of S-stars", ru: "Стрелец A*, орбиты S-звёзд" }

  - key: radiation
    name: { en: "Radiation", ru: "Излучение" }
    description: { en: "How light carries energy: black-body radiation and the radiation laws.", ru: "Как свет переносит энергию: излучение чёрного тела и законы излучения." }
    star: { x: 560, y: 350, size: 22, filled: false }
    subtopics:
      - key: black-body
        name: { en: "Black-body radiation", ru: "Излучение чёрного тела" }
        description: { en: "Planck, Wien, Stefan–Boltzmann, Rayleigh–Jeans", ru: "Законы Планка, Вина, Стефана–Больцмана, Рэлея–Джинса" }
      - key: spectral-lines
        name: { en: "Spectral lines", ru: "Спектральные линии" }
        description: { en: "Bohr model, Boltzmann and Saha equations", ru: "Модель Бора, формулы Больцмана и Саха" }
      - key: radiative-transfer
        name: { en: "Radiative transfer", ru: "Перенос излучения" }
        description: { en: "Optical depth and extinction", ru: "Оптическая толща и поглощение" }
      - key: doppler-and-broadening
        name: { en: "Doppler shift", ru: "Эффект Доплера" }
        description: { en: "Doppler shift and line broadening", ru: "Доплеровский сдвиг и уширение линий" }
      - key: radiation-processes
        name: { en: "Radiation processes", ru: "Механизмы излучения" }
        description: { en: "Thomson and Compton scattering, bremsstrahlung, synchrotron", ru: "Томсоновское и комптоновское рассеяние, тормозное и синхротронное излучение" }
      - key: radio-astronomy
        name: { en: "Radio astronomy", ru: "Радиоастрономия" }
        description: { en: "Brightness temperature, 21 cm line", ru: "Яркостная температура, линия 21 см" }
      - key: flux-and-luminosity
        name: { en: "Flux and luminosity", ru: "Поток и светимость" }
        description: { en: "Flux, luminosity, intensity, surface brightness", ru: "Поток, светимость, интенсивность, поверхностная яркость" }

  - key: cosmology
    name: { en: "Cosmology", ru: "Космология" }
    description: { en: "The universe as a whole: redshift, expansion and its age.", ru: "Вселенная как целое: красное смещение, расширение и возраст." }
    star: { x: 965, y: 150, size: 20, filled: true }
    subtopics:
      - key: hubbles-law
        name: { en: "Hubble’s law", ru: "Закон Хаббла" }
        description: { en: "Redshift; comoving, luminosity and angular diameter distances", ru: "Красное смещение; сопутствующее, фотометрическое и угловое расстояния" }
      - key: friedmann-equations
        name: { en: "Friedmann equations", ru: "Уравнения Фридмана" }
        description: { en: "Critical density and density parameters", ru: "Критическая плотность и параметры плотности" }
      - key: age-and-lookback-time
        name: { en: "Age of the Universe", ru: "Возраст Вселенной" }
        description: { en: "Age and lookback time", ru: "Возраст и время, прошедшее с испускания света" }
      - key: cmb
        name: { en: "Microwave background", ru: "Реликтовое излучение" }
        description: { en: "Temperature, dipole, recombination, horizon", ru: "Температура, дипольная анизотропия, рекомбинация, горизонт" }
      - key: early-universe
        name: { en: "Early Universe", ru: "Ранняя Вселенная" }
        description: { en: "Nucleosynthesis and thermal history", ru: "Первичный нуклеосинтез и тепловая история" }
      - key: dark-matter-and-energy
        name: { en: "Dark matter and energy", ru: "Тёмная материя и энергия" }
        description: { en: "Evidence for dark matter and dark energy", ru: "Свидетельства тёмной материи и тёмной энергии" }
      - key: expansion-and-horizons
        name: { en: "Horizons and expansion", ru: "Горизонты и расширение" }
        description: { en: "Horizons and the scale factor", ru: "Горизонты и масштабный фактор" }

  - key: special-relativity
    name: { en: "Special relativity", ru: "СТО" }
    description: { en: "Fast-moving light and matter: time dilation and mass–energy.", ru: "Быстро движущиеся тела: замедление времени и связь массы с энергией." }
    star: { x: 770, y: 415, size: 18, filled: false }
    subtopics:
      - key: lorentz-transformations
        name: { en: "Lorentz transformations", ru: "Преобразования Лоренца" }
        description: { en: "Time dilation, length contraction", ru: "Замедление времени, сокращение длины" }
      - key: velocity-addition
        name: { en: "Velocity addition", ru: "Сложение скоростей" }
        description: { en: "Relativistic velocity addition", ru: "Релятивистское сложение скоростей" }
      - key: relativistic-doppler
        name: { en: "Relativistic Doppler", ru: "Релятивистский Доплер" }
        description: { en: "The relativistic Doppler effect", ru: "Релятивистский эффект Доплера" }
      - key: beaming
        name: { en: "Aberration and beaming", ru: "Аберрация и излучение" }
        description: { en: "Relativistic aberration and beaming", ru: "Релятивистская аберрация и направленность излучения" }
      - key: superluminal-motion
        name: { en: "Superluminal motion", ru: "Сверхсветовое движение" }
        description: { en: "Apparent superluminal motion in jets", ru: "Видимое сверхсветовое движение в джетах" }
      - key: energy-momentum
        name: { en: "Energy and momentum", ru: "Энергия и импульс" }
        description: { en: "Particle collisions and threshold energies", ru: "Столкновения частиц и пороговые энергии" }
      - key: cosmic-rays
        name: { en: "Cosmic rays", ru: "Космические лучи" }
        description: { en: "GZK cutoff, pair production", ru: "Предел ГЗК, рождение пар" }

  - key: history-of-astronomy
    name: { en: "History of astronomy", ru: "История астрономии" }
    description: { en: "How our picture of the sky was built, from antiquity to today.", ru: "Как складывалась наша картина неба, от древности до наших дней." }
    star: { x: 965, y: 360, size: 20, filled: true }
    subtopics:
      - key: ancient-measurements
        name: { en: "Ancient measurements", ru: "Древние измерения" }
        description: { en: "Eratosthenes, Aristarchus, Hipparchus", ru: "Эратосфен, Аристарх, Гиппарх" }
      - key: world-models
        name: { en: "Models of the world", ru: "Модели мира" }
        description: { en: "Ptolemy, epicycles, Copernicus, Tycho", ru: "Птолемей, эпициклы, Коперник, Тихо Браге" }
      - key: kepler-galileo-newton
        name: { en: "Kepler to Newton", ru: "От Кеплера до Ньютона" }
        description: { en: "Reconstructing the arguments of Kepler, Galileo and Newton", ru: "Рассуждения и расчёты Кеплера, Галилея и Ньютона" }
      - key: great-discoveries
        name: { en: "Great discoveries", ru: "Великие открытия" }
        description: { en: "Uranus, Neptune, Pluto, Cepheid period–luminosity, Hubble", ru: "Уран, Нептун, Плутон, зависимость период–светимость, Хаббл" }
      - key: chronology
        name: { en: "Calendars and chronology", ru: "Календари и хронология" }
        description: { en: "Dates of eclipses, comets and supernovae", ru: "Даты затмений, комет и сверхновых" }

  - key: mathematics
    name: { en: "Mathematics", ru: "Математика" }
    description: { en: "Tools for solving problems: trigonometry, approximations and estimates.", ru: "Инструменты для решения задач: тригонометрия, приближения и оценки." }
    star: { x: 965, y: 255, size: 18, filled: false }
    subtopics:
      - key: spherical-trigonometry
        name: { en: "Spherical trigonometry", ru: "Сферическая тригонометрия" }
        description: { en: "Triangles on the sphere", ru: "Треугольники на сфере" }
      - key: approximations
        name: { en: "Approximations", ru: "Приближения" }
        description: { en: "Small angles and series", ru: "Малые углы и разложения в ряды" }
      - key: calculus
        name: { en: "Calculus", ru: "Анализ" }
        description: { en: "Integration, differentiation, optimisation", ru: "Интегрирование, дифференцирование, оптимизация" }
      - key: errors-and-log-scales
        name: { en: "Errors and log scales", ru: "Погрешности и логарифмы" }
        description: { en: "Error propagation and logarithmic scales", ru: "Перенос погрешностей и логарифмические шкалы" }
      - key: vectors-and-rotations
        name: { en: "Vectors and rotations", ru: "Векторы и повороты" }
        description: { en: "Vectors and rotation matrices", ru: "Векторы и матрицы поворота" }
      - key: estimates
        name: { en: "Estimates", ru: "Оценки" }
        description: { en: "Fermi estimates and dimensional analysis", ru: "Оценки Ферми и анализ размерностей" }
      - key: numerical-methods
        name: { en: "Numerical methods", ru: "Численные методы" }
        description: { en: "Solving problems numerically", ru: "Численное решение задач" }

  - key: physics
    name: { en: "Physics", ru: "Физика" }
    description: { en: "The physics behind astronomy problems.", ru: "Физика, на которой держатся астрономические задачи." }
    star: { x: 765, y: 260, size: 22, filled: true }
    subtopics:
