<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StellarTask v1: problems</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Onest:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap">
<style>
body{margin:0}
a{color:#161616}a:hover{color:#3B6E99}
.sr{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500}
.mo{font-family:'JetBrains Mono',monospace}
.nv{font-size:14px;text-decoration:none;padding:10px 0}
.nd{position:absolute;display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:#161616;transform:translate(-50%,-14px);text-align:center;background:none;border:0;padding:0;cursor:pointer;font:inherit}
.nd:hover .sr{font-style:italic}
.tr{display:grid;grid-template-columns:40px 300px minmax(0,1fr) 60px;align-items:baseline;column-gap:24px;padding:16px 0 14px;text-decoration:none}
.tr:hover .sr{font-style:italic}
.gm{display:flex;flex-direction:column;gap:14px;text-decoration:none}
.gm:hover .sr{font-style:italic}
.rl{display:flex;align-items:center;gap:16px;min-height:38px;width:100%;font:400 15px 'Onest',sans-serif;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.pk{font:inherit;font-style:italic;background:none;border:0;padding:0 2px;color:#161616;text-decoration:underline wavy #A9B9C7;text-decoration-thickness:1.3px;text-underline-offset:8px;cursor:pointer}
</style>
</helmet>
<div style="min-height: 100%; background: #FDFCFA; font-family: 'Onest', system-ui, sans-serif; color: #161616">
<div style="max-width: 1216px; margin: 0 auto; padding: 0 64px">
<header style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 24px; padding: 32px 0 22px">
<a href="F1-Home.dc.html" style="display: flex; align-items: center; gap: 14px; text-decoration: none">
<svg viewBox="0 0 100 100" width="44" height="44" aria-hidden="true"><path d="M50 4 L63 37 L98 39 L70 60 L80 95 L50 74 L19 94 L31 59 L3 37 L38 37 Z" fill="none" stroke="#161616" stroke-width="2.2" stroke-linejoin="round"/><path d="M48 11 L60 40 L92 42 L65 61 L75 89 L49 70 L24 88 L35 58 L9 41 L42 40 Z" fill="none" stroke="#161616" stroke-width="1.2" stroke-linejoin="round" opacity="0.6"/><path d="M52 1 L65 35 L100 37 L72 59 L82 98 L51 76 L17 97 L29 60 L0 36 L36 35 Z" fill="none" stroke="#161616" stroke-width="0.8" stroke-linejoin="round" opacity="0.35"/></svg>
<span style="display: flex; flex-direction: column; gap: 2px"><span class="sr" style="font-size: 30px; font-style: italic; line-height: 1">StellarTask</span></span>
</a>
<nav aria-label="Main" style="display: flex; gap: 36px; align-items: center; flex-wrap: wrap"><a class="nv" href="F1-Home.dc.html" aria-current="page" style="text-decoration: underline; text-underline-offset: 6px">Topics</a><a class="nv" href="#">Theory notes</a><a class="nv" href="F1-Home.dc.html#games">Games</a><span class="mo" style="font-size: 12px; color: #6F6B64">RU · <span style="color: #161616">EN</span></span></nav>
</header>
<svg viewBox="0 0 1000 10" preserveAspectRatio="none" width="100%" height="10" aria-hidden="true" style="display: block"><path d="M2 5 C 140 2, 300 8, 470 5 S 800 2, 998 6" fill="none" stroke="#161616" stroke-width="1.1" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>
<div style="display: flex; flex-wrap: wrap; gap: 72px; padding-top: 56px; align-items: flex-start">
<aside aria-label="Subtopics" style="flex: 1 1 220px; max-width: 250px; position: sticky; top: 32px">
<a href="F1-Topic.dc.html" class="mo" style="display: inline-block; margin-bottom: 26px; font-size: 12px; color: #6F6B64; text-decoration: none; padding: 6px 0">← celestial mechanics</a>
<p class="mo" style="margin: 0 0 16px; font-size: 11.5px; color: #6F6B64">subtopics · tap to toggle</p>
<div style="position: relative">
<svg viewBox="0 0 6 400" preserveAspectRatio="none" width="6" height="100%" aria-hidden="true" style="position: absolute; left: 4px; top: 10px; height: calc(100% - 20px)"><path d="M3 0 C 4.5 80, 1.5 170, 3.5 250 S 2.5 360, 3 400" stroke="#161616" stroke-width="1" fill="none" vector-effect="non-scaling-stroke"/></svg>
<sc-for list="{{rail}}" as="t" hint-placeholder-count="6">
<button class="rl" onClick="{{t.toggle}}" aria-pressed="{{t.pressed}}" style="color: {{t.color}}"><svg viewBox="0 0 14 14" width="14" height="14" aria-hidden="true" style="position: relative; flex: none"><circle cx="7" cy="7" r="5.5" fill="{{t.dotFill}}" stroke="#161616" stroke-width="1.2"/></svg><span style="flex: 1">{{t.name}}</span><span class="mo" style="font-size: 11px; color: #9A958C">{{t.count}}</span></button>
</sc-for>
</div>
</aside>
<main style="flex: 999 1 560px; min-width: 0">
<h1 class="sr" style="margin: 0; font-size: 80px; line-height: 0.95; font-weight: 400">Celestial <span style="font-style: italic">mechanics</span></h1>
<p class="sr" style="margin: 22px 0 0; font-size: 28px; line-height: 1.6; font-weight: 400; color: #45423D">at difficulty <button class="pk">any</button>, in <button class="pk">any language</button>, from <button class="pk">all olympiads</button>, <button class="pk">scans included</button></p>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 24px; margin: 40px 0 20px">
<label for="f1q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search problems</label>
<input id="f1q" type="search" placeholder="Search in this topic" style="flex: 0 1 360px; font: 300 17px 'Onest', sans-serif; padding: 8px 0; border: 0; border-bottom: 1px solid #161616; background: transparent; color: #161616">
<span class="mo" style="font-size: 12px; color: #6F6B64">{{shown}} problems</span>
</div>
<sc-if value="{{none}}" hint-placeholder-val="{{false}}"><p class="sr" style="font-size: 26px; font-style: italic; color: #6F6B64; padding: 48px 0">No problems here. Turn a subtopic back on.</p></sc-if>
<sc-for list="{{problems}}" as="p" hint-placeholder-count="6">
<svg viewBox="0 0 800 8" preserveAspectRatio="none" width="100%" height="8" aria-hidden="true" style="display: block"><path d="M1 4 C 200 2, 470 7, 799 3" fill="none" stroke="#BDB7AB" stroke-width="1" vector-effect="non-scaling-stroke"/></svg>
<article style="display: grid; grid-template-columns: 112px minmax(0, 1fr); column-gap: 32px; padding: 40px 0 44px">
<div style="display: flex; flex-direction: column; gap: 12px">
<span class="sr" style="font-size: 56px; line-height: 0.8; font-weight: 400">{{p.n}}</span>
<span aria-label="{{p.diffLabel}}" style="display: flex; gap: 3px"><sc-for list="{{p.stars}}" as="s" hint-placeholder-count="5"><svg viewBox="0 0 100 100" width="12" height="12" aria-hidden="true"><path d="M50 5 L62 37 L97 39 L69 60 L79 94 L50 73 L20 93 L32 59 L4 37 L39 37 Z" fill="{{s.fill}}" stroke="#161616" stroke-width="7" stroke-linejoin="round"/></svg></sc-for></span>
</div>
<div style="display: flex; flex-direction: column; gap: 16px; min-width: 0">
<span class="mo" style="font-size: 11.5px; color: #6F6B64">{{p.sub}}</span>
<sc-if value="{{p.hasText}}" hint-placeholder-val="{{true}}"><p class="sr" style="margin: 0; font-size: 25px; line-height: 1.45; font-weight: 500">{{p.text}}</p></sc-if>
<sc-if value="{{p.scan}}" hint-placeholder-val="{{false}}"><div style="height: 120px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #6F6B64; background: #F5F3EE">[photo of the original statement]</div></sc-if>
<span class="mo" style="font-size: 11.5px; color: #6F6B64">{{p.src}}</span>
</div>
</article>
</sc-for>
<div style="height: 80px"></div>
</main>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1500}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { off: [] };
}
renderVals() {
var P = [
{ id: 'k2', sub: "Kepler’s laws", diff: 1, src: '[olympiad] 2022 · grade 9 · en/ru', text: 'The sidereal period of a planet is 12 years. Find the semi-major axis of its orbit.' },
{ id: 'k3', sub: 'Orbital speed and energy', diff: 1, src: '[olympiad] 2023 · grade 9 · en/ru', text: 'Find the escape speed from the surface of the Moon.' },
{ id: 'k4', sub: 'Masses from orbits', diff: 2, src: '[olympiad] 2021 · grade 10 · ru', text: 'The components of a visual binary orbit each other with a period of 50 years; the semi-major axis of the relative orbit is 20 AU. Find the total mass of the system.' },
{ id: 'k5', sub: 'Synodic and sidereal periods', diff: 2, src: '[olympiad] 2024 · grade 9 · en/ru', text: 'The synodic period of a superior planet is 1.5 years. Find its sidereal period.' },
{ id: 'k1', sub: "Kepler’s laws", diff: 3, src: '[olympiad] 2024 · grade 11 · en/ru', text: 'A comet moves on an orbit with perihelion distance 0.6 AU and aphelion distance 35 AU. Find its orbital period and its speed at perihelion.' },
{ id: 'k6', sub: 'Transfer orbits', diff: 4, src: '[olympiad] 2023 · grade 11 · ru', text: 'Estimate the duration of a flight from Earth to Mars along a Hohmann transfer orbit.' },
{ id: 'k7', sub: 'Tides and the Roche limit', diff: 5, src: '[olympiad] 2020 · grade 11 · ru · scan', scan: true, text: '' }
];
var SUBS = ["Kepler’s laws", 'Orbital speed and energy', 'Masses from orbits', 'Synodic and sidereal periods', 'Transfer orbits', 'Tides and the Roche limit'];
var self = this;
var off = this.state.off;
var flip = function (v) {
return function () {
self.setState(function (s) {
return { off: s.off.indexOf(v) >= 0 ? s.off.filter(function (x) { return x !== v; }) : s.off.concat([v]) };
});
};
};
var rail = SUBS.map(function (t) {
var on = off.indexOf(t) < 0;
var c = P.filter(function (p) { return p.sub === t; }).length;
return { name: t, count: String(c), pressed: on ? 'true' : 'false', color: on ? '#161616' : '#9A958C', dotFill: on ? '#161616' : '#FDFCFA', toggle: flip(t) };
});
var visible = P.filter(function (p) { return off.indexOf(p.sub) < 0; });
var problems = visible.map(function (p, i) {
return {
n: (i < 9 ? '0' : '') + (i + 1), sub: p.sub.toLowerCase(), src: p.src, text: p.text,
scan: !!p.scan, hasText: !p.scan,
diffLabel: 'Difficulty ' + p.diff + ' of 5',
stars: [1, 2, 3, 4, 5].map(function (k) { return { fill: k <= p.diff ? '#161616' : 'none' }; })
};
});
return { rail: rail, problems: problems, shown: String(visible.length), none: visible.length === 0 };
}
}
</script>
</body>
</html>
