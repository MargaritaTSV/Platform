<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ConstellationFinder — StellarTask</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=JetBrains+Mono:wght@400&display=swap">
<style>
  :root {
    --bg: #FDFCFA;
    --ink: #161616;
    --muted: #6F6B64;
  }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    font-family: system-ui, sans-serif;
    text-align: center;
  }
  h1 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-size: 48px;
    margin: 0 0 16px;
  }
  p.status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin: 0 0 40px;
  }
  a.back {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--ink);
    text-decoration: none;
  }
  a.back:hover {
    color: #3B6E99;
  }
  a.back:focus-visible {
    outline: 2px solid #3B6E99;
    outline-offset: 3px;
  }
</style>
</head>
<body>
  <h1>ConstellationFinder</h1>
  <p class="status">Скоро · Coming soon</p>
  <a class="back" href="/">&larr; На главную · Back to StellarTask</a>
</body>
</html>
