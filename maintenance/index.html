<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StellarTask — update in progress</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Onest:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap">
  <style>
    :root {
      --bg: #FDFCFA;
      --ink: #161616;
      --muted: #6F6B64;
      --faint: #9A958C;
      --rule: #BDB7AB;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Onest', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      font-weight: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }
    main {
      max-width: 560px;
      text-align: center;
    }
    .star {
      display: block;
      margin: 0 auto 36px;
      color: var(--ink);
    }
    .label {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--faint);
      margin-bottom: 20px;
    }
    h1 {
      font-family: var(--font-serif);
      font-weight: 500;
      font-size: clamp(30px, 6vw, 46px);
      line-height: 1.12;
      margin: 0 0 18px;
    }
    p {
      font-size: 16px;
      line-height: 1.6;
      color: var(--muted);
      margin: 0 auto;
      max-width: 42ch;
    }
    .rule {
      display: block;
      margin: 40px auto;
      color: var(--rule);
    }
    .ru {
      font-size: 15px;
      color: var(--faint);
    }
    .ru h1 { color: var(--muted); font-size: clamp(24px, 5vw, 34px); margin-bottom: 14px; }
  </style>
</head>
<body>
  <main>
    <svg class="star" width="52" height="52" viewBox="0 0 52 52" fill="none" aria-hidden="true">
      <path d="M26 3 C27 17 31 23 46 26 C31 29 27 35 26 49 C25 35 21 29 6 26 C21 23 25 17 26 3 Z"
            fill="currentColor" opacity="0.9"/>
    </svg>

    <div class="label">StellarTask</div>
    <h1>We’re updating the site</h1>
    <p>StellarTask is temporarily unavailable while we make some improvements. Please check back a little later — thank you for your patience.</p>

    <svg class="rule" width="160" height="12" viewBox="0 0 160 12" fill="none" aria-hidden="true">
      <path d="M2 7 C30 2 52 10 80 6 C108 2 130 10 158 5" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    </svg>

    <div class="ru">
      <h1>Идёт обновление сайта</h1>
      <p>StellarTask временно недоступен — мы вносим улучшения. Загляните чуть позже, спасибо за ожидание.</p>
    </div>
  </main>
</body>
</html>
